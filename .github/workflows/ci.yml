name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip python-pptx
      - name: Run deck tests
        run: python scripts/test_deck.py
      - name: Validate layouts example
        run: |
          python scripts/build_deck.py examples/layouts-deck.json -o /tmp/layouts.pptx --force
          python scripts/validate_deck.py /tmp/layouts.pptx
      - name: Run layout edge-case tests
        run: python -m unittest tests.test_layouts tests.test_examples
